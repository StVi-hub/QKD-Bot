[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qkd-bot"
version = "0.1.0"
description = "Simulation study of BB84 and intercept-resend detection, validated against theory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
